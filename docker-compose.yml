services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ichigo
      POSTGRES_PASSWORD: ichigo
      POSTGRES_DB: ichigo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ichigo"]
      interval: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://ichigo:ichigo@db:5432/ichigo
      CONTENT_DIR: /content
    volumes:
      - ./content:/content:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles: ["full"]

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    profiles: ["full"]

volumes:
  pgdata:
